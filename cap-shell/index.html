<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Check Karo</title>
    <style>
      :root {
        --bg: #0b0d1a;
        --card: #141730;
        --border: #272c4d;
        --primary: #4338ca;
        --primary-2: #6d4ae8;
        --text: #eceefb;
        --muted: #a0a4c4;
        --saffron: #f08c00;
        --success: #3fd49a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        text-align: center;
        padding: 24px;
        background-image:
          radial-gradient(circle at 50% 20%, rgba(109, 74, 232, 0.25), transparent 60%),
          radial-gradient(circle at 80% 80%, rgba(240, 140, 0, 0.15), transparent 50%);
      }
      .container {
        max-width: 360px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 36px 24px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .icon-box {
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        display: grid;
        place-items: center;
        margin-bottom: 20px;
        box-shadow: 0 10px 25px rgba(67, 56, 202, 0.4);
      }
      .title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 6px;
      }
      .subtitle {
        font-size: 13px;
        font-weight: 600;
        color: var(--saffron);
        margin-bottom: 18px;
      }
      .desc {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .btn {
        width: 100%;
        padding: 14px 20px;
        border: none;
        border-radius: 16px;
        font-size: 15px;
        font-weight: 700;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: #ffffff;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(67, 56, 202, 0.4);
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      .btn:active {
        transform: scale(0.98);
        opacity: 0.9;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted);
        margin-bottom: 16px;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--saffron); animation: pulse 1.5s infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.15); }
      }
    </style>
  </head>
  <body>
    <!-- Shown by Capacitor (server.errorPath) when the live site cannot load, e.g. no internet. -->
    <div class="container">
      <div class="icon-box">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <h1 class="title">Check Karo</h1>
      <p class="subtitle">पहले चेक करो, फिर शेयर करो</p>
      <div class="status-pill"><span class="dot"></span><span id="status">Offline · ऑफ़लाइन</span></div>
      <p class="desc">
        No internet connection. Connect to Wi-Fi or mobile data and try again.<br />
        इंटरनेट कनेक्शन नहीं है। वाई-फ़ाई या मोबाइल डेटा चालू करके फिर कोशिश करें।
      </p>
      <button class="btn" id="retry">Retry · फिर कोशिश करें</button>
    </div>
    <script>
      // Keep in sync with server.url in capacitor.config.ts.
      var APP_URL = "https://check-karo--ideathon-projects.us-central1.hosted.app";
      function retry() {
        document.getElementById("status").textContent = "Connecting… · जुड़ रहा है…";
        window.location.href = APP_URL;
      }
      document.getElementById("retry").addEventListener("click", retry);
      // Reconnect by itself as soon as the phone is back online.
      window.addEventListener("online", retry);
    </script>
  </body>
</html>
