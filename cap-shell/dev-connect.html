<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Check Karo</title>
    <style>
      :root {
        --bg: #0b0d1a;
        --card: #141730;
        --border: #272c4d;
        --primary: #4338ca;
        --primary-2: #6d4ae8;
        --text: #eceefb;
        --muted: #a0a4c4;
        --saffron: #f08c00;
        --success: #3fd49a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        text-align: center;
        padding: 24px;
        background-image:
          radial-gradient(circle at 50% 20%, rgba(109, 74, 232, 0.25), transparent 60%),
          radial-gradient(circle at 80% 80%, rgba(240, 140, 0, 0.15), transparent 50%);
      }
      .container {
        max-width: 360px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 36px 24px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .icon-box {
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        display: grid;
        place-items: center;
        margin-bottom: 20px;
        box-shadow: 0 10px 25px rgba(67, 56, 202, 0.4);
      }
      .title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 6px;
      }
      .subtitle {
        font-size: 13px;
        font-weight: 600;
        color: var(--saffron);
        margin-bottom: 18px;
      }
      .desc {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .btn {
        width: 100%;
        padding: 14px 20px;
        border: none;
        border-radius: 16px;
        font-size: 15px;
        font-weight: 700;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: #ffffff;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(67, 56, 202, 0.4);
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      .btn:active {
        transform: scale(0.98);
        opacity: 0.9;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted);
        margin-bottom: 16px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f08c00;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      .quick-actions {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }
      .alt-btn {
        width: 100%;
        padding: 10px 14px;
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .alt-btn:hover { background: rgba(255,255,255,0.1); }
      .badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 6px;
        background: rgba(67, 56, 202, 0.4);
        color: #a5b4fc;
      }
      .custom-box {
        width: 100%;
        margin-top: 12px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        text-align: left;
      }
      .custom-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        margin-bottom: 6px;
        display: block;
      }
      .input-row {
        display: flex;
        gap: 6px;
      }
      .input-row input {
        flex: 1;
        padding: 10px 12px;
        background: #0b0d1a;
        border: 1px solid var(--border);
        border-radius: 10px;
        color: #fff;
        font-size: 13px;
        outline: none;
      }
      .input-row button {
        padding: 10px 14px;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        border: none;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon-box">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <h1 class="title">Check Karo</h1>
      <p class="subtitle">पहले चेक करो, फिर शेयर करो</p>
      
      <div class="status-pill">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Checking live server...</span>
      </div>

      <p class="desc" id="status-desc">
        Connecting to the Check Karo live backend. If you are using USB, make sure dev server is running on port 3001.
      </p>

      <button class="btn" id="primary-btn" onclick="retryMain()">
        Connect to Wi-Fi Server (10.47.27.213)
      </button>

      <div class="quick-actions" style="margin-top: 12px;">
        <button class="alt-btn" onclick="navigate('http://localhost:3001')">
          <span>Connect via USB (localhost:3001)</span>
          <span class="badge">USB / ADB</span>
        </button>
        <button class="alt-btn" onclick="navigate('http://10.0.2.2:3001')">
          <span>Connect via Emulator (10.0.2.2:3001)</span>
          <span class="badge">Emulator</span>
        </button>
      </div>

      <div class="custom-box">
        <label class="custom-label" for="custom-ip">Custom Server URL</label>
        <div class="input-row">
          <input id="custom-ip" type="text" placeholder="http://192.168.1.5:3001" />
          <button onclick="navigateCustom()">Go</button>
        </div>
      </div>
    </div>

    <script>
      const DEFAULT_URL = "http://10.47.27.213:3001";
      const savedUrl = localStorage.getItem("ck_server_url");
      const inputEl = document.getElementById("custom-ip");
      if (savedUrl) inputEl.value = savedUrl;

      const endpoints = [
        savedUrl,
        DEFAULT_URL,
        "http://localhost:3001",
        "http://10.0.2.2:3001"
      ].filter(Boolean);

      async function testEndpoint(url) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 2000);
          await fetch(url + "/api/chat", { method: "HEAD", signal: controller.signal, mode: "no-cors" });
          clearTimeout(timer);
          return true;
        } catch (e) {
          try {
            const controller2 = new AbortController();
            const timer2 = setTimeout(() => controller2.abort(), 2000);
            await fetch(url, { method: "HEAD", signal: controller2.signal, mode: "no-cors" });
            clearTimeout(timer2);
            return true;
          } catch (err2) {
            return false;
          }
        }
      }

      function navigate(url) {
        document.getElementById("status-text").innerText = "Connecting to " + url + "...";
        document.getElementById("status-dot").style.background = "#3fd49a";
        localStorage.setItem("ck_server_url", url);
        window.location.href = url;
      }

      function navigateCustom() {
        let val = inputEl.value.trim();
        if (!val) return;
        if (!val.startsWith("http://") && !val.startsWith("https://")) {
          val = "http://" + val;
        }
        navigate(val);
      }

      function retryMain() {
        navigate(savedUrl || DEFAULT_URL);
      }

      async function autoDetect() {
        for (const url of endpoints) {
          document.getElementById("status-text").innerText = "Probing " + url + "...";
          const ok = await testEndpoint(url);
          if (ok) {
            navigate(url);
            return;
          }
        }
        document.getElementById("status-dot").style.background = "#e53e3e";
        document.getElementById("status-text").innerText = "Server not detected yet";
        document.getElementById("status-desc").innerText = "Ensure 'npm run dev' is running on port 3001. Choose an address below or enter your computer's IP.";
      }

      setTimeout(autoDetect, 800);
    </script>
  </body>
</html>
