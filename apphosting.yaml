# Firebase App Hosting settings (Cloud Run under the hood).
# https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 40
  cpu: 1
  memoryMiB: 1024

env:
  # AI features (Verify, Assistant, AI scheme discovery) need a Gemini API key
  # (https://aistudio.google.com/apikey). Create the secret once, then uncomment
  # these lines and redeploy:
  #   npx firebase apphosting:secrets:set GEMINI_API_KEY --project ideathon-projects
  # - variable: GEMINI_API_KEY
  #   secret: GEMINI_API_KEY
  #   availability:
  #     - RUNTIME
  # gemini-2.5-flash is only served to projects that used it before; otherwise
  # the app switches to GEMINI_FALLBACK_MODEL automatically.
  - variable: GEMINI_MODEL
    value: gemini-2.5-flash
    availability:
      - RUNTIME
  - variable: GEMINI_FALLBACK_MODEL
    value: gemini-3.8-flash
    availability:
      - RUNTIME
  # How long (hours) an AI scheme search is reused before it may run again.
  - variable: DISCOVERY_TTL_HOURS
    value: "72"
    availability:
      - RUNTIME
